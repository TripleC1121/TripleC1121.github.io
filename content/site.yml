projects:
  - slug: batio3-coating
    title:
      zh: 水熱合成壓電 BaTiO3 塗層
      en: Hydrothermal Piezoelectric BaTiO3 Coating
    period: 2024 – 2026
    role:
      zh: 碩士論文
      en: Master's thesis
    tags:
      - Materials
      - Process
    featured: true
    cover: ''
    summary:
      zh: 在 Ti-6Al-4V 骨科植入物表面原位成長壓電 BaTiO3 塗層，並建立製程、微結構與壓電性能的關聯。
      en: In-situ growth of a piezoelectric BaTiO3 coating on Ti-6Al-4V orthopedic implants, linking process, microstructure, and piezoelectric response.
    cv_points:
      zh:
        - 以陽極處理、水熱合成、真空退火與電暈極化，原位成長約 1 µm 的 BaTiO3 塗層。
        - 600 °C 退火使局部 d33 由 66.95 提升至 98.65 pm/V；800 °C 以上出現基材氧化與塗層剝落。
      en:
        - Grew an approximately 1 µm BaTiO3 coating in situ through anodization, hydrothermal synthesis, vacuum annealing, and corona poling.
        - Annealing at 600 °C raised local d33 from 66.95 to 98.65 pm/V; substrate oxidation and delamination appeared at 800 °C and above.
    blocks:
      - t: h
        zh: 研究背景
        en: Background
      - t: p
        zh: 骨頭本身具有壓電特性，受力時會產生電訊號並促進骨修復。這個研究想讓金屬植入物表面也具備同樣的能力。常見的 BaTiO3 鍍膜方法需要 800 °C 以上的高溫，但 Ti-6Al-4V 在高溫下會氧化，導致塗層剝落。
        en: >-
          Bone is piezoelectric: mechanical loading produces electrical signals that promote repair. This work aims to give metal implants the same ability. Common BaTiO3 coating methods need
          temperatures above 800 °C, but Ti-6Al-4V oxidizes at high temperature and the coating delaminates.
      - t: h
        zh: 研究方法
        en: Approach
      - t: p
        zh: |-
          - 建立四站整合製程：陽極處理形成 TiO2 前驅層 → 180 °C 水熱合成 → Ar–4%H2 真空退火 → 電暈極化
          - 比較 3 種前驅層厚度、不同 Ba(OH)2 與 KOH 濃度、4 個退火溫度（400–1000 °C）與 2 種極化方式
          - 以 SEM/EDX、XRD、Raman 分析形貌、成分與晶相，以 PFM 量測局部壓電響應
          - 自行架設電暈極化設備
        en: |-
          - Built a four-step process: anodization to form a TiO2 precursor layer → hydrothermal synthesis at 180 °C → vacuum annealing in Ar–4%H2 → corona poling
          - Compared 3 precursor thicknesses, Ba(OH)2 and KOH concentrations, 4 annealing temperatures (400–1000 °C), and 2 poling modes
          - Characterized morphology, composition, and phase with SEM/EDX, XRD, and Raman; local piezoelectric response measured by PFM
          - Built the corona-poling setup
      - t: h
        zh: 研究成果
        en: Results
      - t: p
        zh: |-
          - 最佳條件：0.5 M Ba(OH)2 + 1.5 M KOH 水熱反應，搭配 600 °C 退火
          - 局部 d33 由 66.95 提升至 98.65 pm/V
          - 800 °C 以上退火會造成基材氧化與塗層剝落
          - 本研究採用的極化條件未能進一步提升壓電響應，是後續要優化的方向
        en: |-
          - Best condition: 0.5 M Ba(OH)2 + 1.5 M KOH hydrothermal reaction with annealing at 600 °C
          - Local d33 increased from 66.95 to 98.65 pm/V
          - Annealing at 800 °C and above caused substrate oxidation and coating delamination
          - The poling conditions used did not further improve the response; this is the next thing to optimize
      - t: h
        zh: 討論
        en: Discussion
      - t: p
        zh: 薄膜的晶相判讀不能只靠單一儀器：XRD 沒有看到四方相的峰分裂，但 Raman 清楚顯示四方相特徵，需要交叉驗證。
        en: >-
          Phase identification in thin coatings should not rely on one instrument: XRD showed no tetragonal peak splitting, while Raman clearly showed tetragonal features. Cross-validation was
          necessary.
  - slug: pvdf-nanofiber
    title:
      zh: 壓電 PVDF 奈米纖維膜促進骨生長
      en: Piezoelectric PVDF Nanofiber Films for Bone Growth
    period: 2024 – 2026
    role:
      zh: ORS 2026 第一作者
      en: First author, ORS 2026
    tags:
      - Materials
      - Biomedical
    featured: true
    cover: ''
    summary:
      zh: 以靜電紡絲製備壓電奈米纖維膜作為骨科植入物塗層，並以細胞與動物實驗評估成效。
      en: Electrospun piezoelectric nanofiber films as an orthopedic implant coating, evaluated in cell and animal studies.
    cv_points:
      zh:
        - 以靜電紡絲、退火與極化製備 PVDF/BaTiO3 薄膜：β 相 43–48%、d33 為 56–60 pC/N。
        - 體外鈣沉積提升 1.5–2 倍；體內破壞載重 150 對 120 N（p = 0.045）。
      en:
        - 'Fabricated PVDF/BaTiO3 films by electrospinning, annealing, and poling: β-phase 43–48%, d33 56–60 pC/N.'
        - In vitro calcium deposition up 1.5–2×; in vivo failure load 150 vs. 120 N (p = 0.045).
    blocks:
      - t: h
        zh: 研究背景
        en: Background
      - t: p
        zh: 傳統骨科植入物常遇到癒合延遲的問題。壓電材料能在受力時產生微小電訊號，模擬骨組織的電機械特性。
        en: Conventional orthopedic implants can suffer from delayed healing. Piezoelectric materials generate small electrical signals under load, mimicking the electromechanical behavior of bone.
      - t: h
        zh: 研究方法
        en: Approach
      - t: p
        zh: |-
          - 以靜電紡絲、退火與極化製備 PVDF 奈米纖維膜，並加入 20 wt% BaTiO3 奈米顆粒提升壓電性
          - 量測纖維形貌、β 相比例（FTIR）、孔隙率、拉伸強度、接觸角與 d33
          - 以 MC3T3-E1 前驅成骨細胞進行體外實驗，並在大鼠股骨缺損模型中評估（與骨科醫師合作）
        en: |-
          - Fabricated PVDF nanofiber films by electrospinning, annealing, and poling, with 20 wt% BaTiO3 nanoparticles added to raise piezoelectricity
          - Measured fiber morphology, β-phase fraction (FTIR), porosity, tensile strength, contact angle, and d33
          - Ran in vitro tests with MC3T3-E1 preosteoblasts and an in vivo rat femoral defect study (with orthopedic surgeons)
      - t: h
        zh: 研究成果
        en: Results
      - t: p
        zh: |-
          - 纖維直徑 90–200 nm，β 相比例 43–48%，d33 為 56–60 pC/N，拉伸強度約 25 MPa
          - 體外：21 天鈣沉積提升 1.5–2 倍
          - 體內：60 天後三點彎曲最大破壞載重，PVDF 塗層組 150 ± 20 N，未塗層對照組 120 ± 15 N（p = 0.045）
        en: |-
          - Fiber diameter 90–200 nm, β-phase 43–48%, d33 56–60 pC/N, tensile strength about 25 MPa
          - In vitro: 1.5–2× calcium deposition at 21 days
          - In vivo: maximum failure load at 60 days was 150 ± 20 N for PVDF-coated pins versus 120 ± 15 N for uncoated controls (p = 0.045)
      - t: h
        zh: 研究限制
        en: Limitations
      - t: p
        zh: 動物實驗樣本數少，仍需更大規模的驗證。成果已被 ORS 2026 年會接受。
        en: The animal sample size was small and larger studies are needed. Accepted at the ORS 2026 Annual Meeting.
