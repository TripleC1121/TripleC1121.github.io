<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>網站管理後台</title>
<style>
:root{--ink:#0e1726;--muted:#6b7887;--line:#dde3ea;--bg:#f2f5f8;--accent:#1f7ae0;--navy:#0b1b33;--ok:#12805c;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{position:sticky;top:0;z-index:9;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
header b{font-size:17px}header .sp{flex:1}#status{font-size:14px;color:#cfe0f5}
main{max-width:1000px;margin:0 auto;padding:22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{font:inherit;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.box>h3{margin:0 0 4px;font-size:16px}.hint{color:var(--muted);font-size:13.5px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
input[type=text],input[type=password],textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:84px;resize:vertical}textarea.tall{min-height:260px;font-family:ui-monospace,Consolas,monospace;font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.btn{font:inherit;padding:9px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn.w{background:#fff;color:var(--accent)}.btn.d{background:#fff;color:var(--bad);border-color:#e7b9b5}.btn.s{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.itemhead{display:flex;align-items:center;gap:8px;cursor:pointer}.itemhead b{flex:1}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.m{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafbfc}
.m .th{height:120px;background:#e9eef4 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);word-break:break-all;padding:8px;text-align:center}
.m .in{padding:8px 10px}.m input{font-size:13px;padding:6px 8px;margin-bottom:5px}.m .row{display:flex;gap:5px;flex-wrap:wrap}
.m.cover{border:2px solid var(--accent)}
.drop{border:2px dashed #b9c6d6;border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:#f8fafc;cursor:pointer}
.drop.over{border-color:var(--accent);background:#eaf2fc}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0 0;color:var(--ink);font-size:14px}.chk input{width:auto}
.doc{margin-top:8px}.blk{border:1px solid var(--line);border-left:4px solid #b9c6d6;border-radius:10px;padding:10px 14px 14px;background:#fff}.blk.t-h{border-left-color:#0b1b33}.blk.t-image,.blk.t-video,.blk.t-file{border-left-color:#19c2b0}.blk.t-callout{border-left-color:#f2a93b}
.blk .bar{display:flex;align-items:center;gap:6px;margin-bottom:8px}.blk .ty{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}.blk.t-h input{font-weight:700;font-size:16px}
.ins{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 4px;opacity:.35;transition:opacity .15s;font-size:13px;color:var(--muted)}.ins:hover{opacity:1}
.grip{cursor:grab;font-size:18px;color:#8a97a6;padding:0 6px;user-select:none}.grip:active{cursor:grabbing}.blk.dropto{outline:2px dashed var(--accent);outline-offset:3px}
ol.steps{padding-left:20px;margin:6px 0}code{background:#eef2f6;padding:1px 6px;border-radius:4px}
</style>
</head>
<body>
<header><b>網站管理後台</b><span id="status"></span><span class="sp"></span>
  <a class="btn w s" href="./" target="_blank">開啟網站</a>
  <button class="btn" id="save" hidden>儲存並發布</button>
  <button class="btn w s" id="logout" hidden>登出</button>
</header>
<main id="main"></main>
<script src="assets/vendor/js-yaml.min.js"></script>
<script src="assets/js/labels.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
