projects:
  - slug: batio3-coating
    title:
      zh: 促進骨癒合之水熱合成壓電BaTiO3塗層技術開發
      en: Development of Hydrothermal Piezoelectric BaTiO3 Coating Technology for Promoting Bone Healing
    period: 2024 – 2026
    role:
      zh: 碩士論文
      en: Master's thesis
    tags:
      - Materials
      - Process
    featured: false
    cover: assets/projects/batio3-coating/file-1794922190722.png
    summary:
      zh: 在 Ti-6Al-4V 骨科植入物表面原位成長壓電 BaTiO3 塗層，並建立製程、微結構與壓電性能的關聯。
      en: In-situ growth of a piezoelectric BaTiO3 coating on Ti-6Al-4V orthopedic implants, linking process, microstructure, and piezoelectric response.
    cv_points:
      zh:
        - 以陽極處理、水熱合成、真空退火與電暈極化，在Ti-6Al-4V上原位成長約 1 µm 的 BaTiO3 塗層
        - 運用 SEM/EDX、XRD、Raman及PFM，多方面探討材料之特性，建立製程與材料性質表現之關聯
        - 調控製程參數並優化，成功將壓電特性顯著提升67% ；同時確認800 °C 以上出現基材氧化與塗層剝落的失效模式
      en:
        - Grew an approximately 1 µm BaTiO3 coating in situ on Ti-6Al-4V through anodization, hydrothermal synthesis, vacuum annealing, and corona poling.
        - Using SEM/EDX, XRD, Raman, and PFM, exploring the material properties from multiple perspectives, establishing the correlation between process and material performance.
        - >-
          By adjusting and optimizing process parameters, successfully improved the piezoelectric properties by 67%. Simultaneously, we confirmed that substrate oxidation and coating peeling failure
          modes occur above 800 °C.
    blocks:
      - t: h
        zh: 研究背景
        en: Background
      - t: p
        zh: 骨組織本身具有壓電特性，當骨骼受到力學刺激時可產生局部電位變化，進而活化細胞訊號傳遞並促進骨修復。基於此，本研究旨在於Ti-6Al-4V骨科植入物表面製備具壓電特性之BaTiO3（BTO）塗層，藉由材料本身之壓電效應，建立有利於骨癒合之電生理微環境。
        en: >-
          Bone exhibits intrinsic piezoelectricity, and mechanical loading can generate localized electrical potentials that promote cellular signaling and bone repair. Based on this concept, this
          study aimed to fabricate a piezoelectric BaTiO3 (BTO) coating on Ti-6Al-4V orthopedic implants in order to create a bioelectrical microenvironment favorable for bone healing. 
      - t: h
        zh: 研究方法
        en: Approach
      - t: p
        zh: |-
          - 建立四站整合製程：陽極處理形成 TiO2 前驅層 → 水熱合成 → 真空退火 → 電暈極化
          - 比較前驅層厚度、不同 Ba(OH)2 與 KOH 濃度、退火溫度（400–1000 °C）與 極化方式
          - 以 SEM/EDX、XRD、Raman 分析形貌、成分與晶相，以 PFM 量測局部壓電響應
          - 電暈極化設備架設與開發
        en: |-
          - Built a four-step process: anodization to form a TiO2 precursor layer → hydrothermal synthesis → vacuum annealing → polarization
          - Compared the precursor thicknesses, Ba(OH)2 and KOH concentrations, annealing temperatures (400–1000 °C), and poling modes
          - Characterized morphology, composition, and phase with SEM/EDX, XRD, and Raman; local piezoelectric response measured by PFM
          - Built and developed the corona-poling device
      - t: image
        files:
          - file-1794922433125.png
        caption:
          zh: ''
          en: ''
      - t: h
        zh: 研究成果
        en: Results
      - t: image
        files:
          - XRD_RAMAN.png
          - PFM.png
        caption:
          zh: ''
          en: ''
    cover_hero: false
    cover_fit: cover
  - slug: pvdf-nanofiber
    title:
      zh: 增進骨生長之壓電PVDF奈米纖維薄膜開發與應用
      en: Development and Application of Piezoelectric PVDF Nanofiber Films for Enhancing Bone Growth
    period: 2024 – 2026
    role:
      zh: 碩士級研究助理, NTU Spark / 第一作者, ORS Conference 2026
      en: Master-degree research assistant, NTU Spark / First author, ORS Conference 2026
    tags:
      - Materials
      - Biomedical
    featured: true
    cover: ''
    summary:
      zh: 以靜電紡絲製備壓電奈米纖維膜作為骨科植入物塗層，並以細胞與動物實驗評估成效。
      en: Electrospun piezoelectric nanofiber films as an orthopedic implant coating, evaluated in cell and animal studies.
    cv_points:
      zh:
        - 以靜電紡絲、退火與極化製備 PVDF 薄膜，有效轉化PVDF β相並提升其壓電特性
        - 透過In vivo and In vitro study 驗證壓電促進骨癒合之成效；體外鈣沉積提升 1.5–2 倍，體內骨頭強度提升20-30%
      en:
        - PVDF films were prepared by electrospinning, annealing, and polarization, effectively converting the PVDF β phase and enhancing its piezoelectric properties.
        - >-
          The effectiveness of piezoelectricity in promoting bone healing was verified through in vivo and in vitro studies; in vitro calcium deposition was increased by 1.5–2 times, and in vivo bone
          strength was increased by 20–30%.
    blocks:
      - t: h
        zh: 研究背景
        en: Background
      - t: p
        zh: 傳統骨科植入物常遇到癒合延遲的問題。壓電材料能在受力時產生微小電訊號，模擬骨組織的電機械特性。
        en: Conventional orthopedic implants can suffer from delayed healing. Piezoelectric materials generate small electrical signals under load, mimicking the electromechanical behavior of bone.
      - t: h
        zh: 研究方法
        en: Approach
      - t: p
        zh: |-
          - 以靜電紡絲、退火與極化製備 PVDF 奈米纖維膜，並加入 20 wt% BaTiO3 奈米顆粒提升壓電性
          - 量測纖維形貌、β 相比例（FTIR）、孔隙率、拉伸強度、接觸角與 d33
          - 以 MC3T3-E1 前驅成骨細胞進行體外實驗，並在大鼠股骨缺損模型中評估（與骨科醫師合作）
        en: |-
          - Fabricated PVDF nanofiber films by electrospinning, annealing, and poling, with 20 wt% BaTiO3 nanoparticles added to raise piezoelectricity
          - Measured fiber morphology, β-phase fraction (FTIR), porosity, tensile strength, contact angle, and d33
          - Ran in vitro tests with MC3T3-E1 preosteoblasts and an in vivo rat femoral defect study (with orthopedic surgeons)
      - t: h
        zh: 研究成果
        en: Results
      - t: image
        files:
          - 1.png
        caption:
          zh: ''
          en: ''
