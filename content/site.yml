  - slug: wdlc-corrosion
    title:
      zh: W-DLC 薄膜之腐蝕行為
      en: Corrosion Behavior of W-DLC Films
    period: 2022 – 2024
    role:
      zh: ICETAT 2024 第一作者
      en: First author, ICETAT 2024
    tags:
      - Materials
    cover: ''
    summary:
      zh: 以電化學方法評估電漿氮化中間層對 316L 不鏽鋼上 W-DLC 薄膜抗腐蝕性的影響。
      en: Electrochemical evaluation of how a plasma-nitrided interlayer affects the corrosion resistance of W-DLC films on 316L steel.
    cv_points:
      zh:
        - 以動電位極化、EIS 與 Raman 評估薄膜（鍍膜由金屬中心執行），證實氮化中間層降低抗腐蝕性。
      en:
        - Tested films by potentiodynamic polarization, EIS, and Raman (deposition by MIRDC); showed the nitrided interlayer lowered corrosion resistance.
    blocks:
      - t: h
        zh: 研究問題
        en: Research Question
      - t: p
        zh: 在 316L 不鏽鋼上鍍鎢摻雜類鑽碳（W-DLC）薄膜之前，先做電漿氮化，能不能提升抗腐蝕性？
        en: Does plasma nitriding 316L stainless steel before depositing a tungsten-doped diamond-like carbon (W-DLC) film improve corrosion resistance?
      - t: h
        zh: 研究方法
        en: Approach
      - t: p
        zh: |-
          - 設計比較組別：有無氮化中間層的 W-DLC 薄膜（鍍膜與氮化由金屬工業研究發展中心執行）
          - 以動電位極化與電化學阻抗譜（EIS）評估抗腐蝕性
          - 以 Raman（ID/IG）與接觸角分析薄膜結構與表面性質
        en: |-
          - Designed the comparison: W-DLC films with and without a nitrided interlayer (deposition and nitriding by the Metal Industries Research & Development Centre)
          - Evaluated corrosion resistance by potentiodynamic polarization and electrochemical impedance spectroscopy (EIS)
          - Analyzed film structure and surface properties by Raman (ID/IG) and contact angle
      - t: h
        zh: 研究成果
        en: Results
      - t: p
        zh: 氮化中間層沒有提升抗腐蝕性，反而使腐蝕電位降低、電流密度升高、阻抗下降。推論原因是氮化後表面多孔，使薄膜附著性變差。
        en: >-
          The nitrided interlayer did not help. It lowered the corrosion potential, raised the current density, and reduced impedance, likely because the porous nitrided surface weakened film
          adhesion.
      - t: h
        zh: 發表
        en: Publications
      - t: p
        zh: 2023 CTTT 與 2024 ICETAT 研討會發表，並獲國科會大專學生研究計畫補助。
        en: CTTT 2023 and ICETAT 2024; supported by an NSTC College Student Research Scholarship.
